# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same Bun version as local, read from "packageManager" in package.json.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Next.js itself runs on Node; pin a version it supports.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # --frozen-lockfile fails the build if bun.lock is out of date.
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHEF_ALEX_S_CAULDRON }}
          channelId: live
          projectId: chef-alex-s-cauldron
